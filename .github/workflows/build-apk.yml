name: Build NIFTY Profit Engine APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract Android project
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No project ZIP found"
            exit 1
          fi

          mkdir -p build-src
          unzip -q "$ZIP_FILE" -d build-src

          echo "Extracted project:"
          find build-src -maxdepth 2 -type f | head -50

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: build-src
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NIFTY-Profit-Engine-V45-debug
          path: build-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
